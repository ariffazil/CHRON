[project]
name = "chron-organ"
version = "4.2.0"
description = "CHRON — Temporal Consequence Tracker, Calibration & Attention Debt Organ for arifOS"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=3.0.0",
    "nats-py>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chron", "chron.scripts"]

[tool.setuptools.package-dir]
"chron" = "."
"chron.scripts" = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
